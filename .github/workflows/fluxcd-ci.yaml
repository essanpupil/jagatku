name: Check kubernetes manifest
on:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes-manifest/**"
permissions:
  pull-requests: write
  packages: read
env:
  NO_COLOR: "1"

jobs:
  check_manifest_diff:
    runs-on: laptop1
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check manifest diff
        id: manifest-diff
        continue-on-error: true
        run: |
          flux diff kustomization jagatku-manifest-selection --path kubernetes-manifest/ 2>&1 | tee flux_diff.txt
      - name: Post comment of check diff result
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./flux_diff.txt
      - name: State workflow to fail
        if: steps.manifest-diff.outcome == 'failure'
        run: |
          echo "Kubernetes new manifest fail"
          exit 1
