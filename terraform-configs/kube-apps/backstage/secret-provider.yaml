apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: backstage-db-auth
  namespace: ${namespace}
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.laptop1.local"
    roleName: ${vault_role}
    objects: |
      - objectName: "db_password"
        secretPath: ${secret_path}
        secretKey: "password"
      - objectName: "db_username"
        secretPath: ${secret_path}
        secretKey: "username"
