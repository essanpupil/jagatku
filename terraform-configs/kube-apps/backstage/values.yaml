backstage:
  appConfig:
    app:
      title: "Jagat Platform"
      baseUrl: https://backstage.jagatku.local
    backend:
      baseUrl: https://backstage.jagatku.local
      cors:
        origin: https://backstage.jagatku.local
    # catalog:
    #   providers:
    #     keycloakOrg:
    #       default:
    #         baseUrl: http://keycloak.jagat.local
    #         loginRealm: jagatku
    #         realm: jagatku
    #         clientId: backstage-jagat
    #         clientSecret:
    #         schedule:
    #           frequency:
    #           timeout:
    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    search:
      engine: lunr
ingress:
  enabled: true
  className: cilium
  host: backstage.jagatku.local
  annotations:
    ingress.cilium.io/force-https: enabled
  tls:
    enabled: true
    secretName: ${tls_secret}
serviceAccount:
  create: false
  name: ${service_account_name}
