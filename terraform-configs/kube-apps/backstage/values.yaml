backstage:
  appConfig:
      app:
        title: "Jagat Platform"
        baseUrl: http://backstage.jagatku.local
      backend:
        baseUrl: http://backstage.jagatku.local
        cors:
          origin: http://backstage.jagatku.local
        csp:
          upgrade-insecure-requests: false
ingress:
  enabled: true
  className: cilium
  host: backstage.jagatku.local
  annotations:
    ingress.cilium.io/force-https: disabled
serviceAccount:
  create: true
  name: ${service_account_name}
