k8sServiceHost: kubernetes.jagat.local
k8sServicePort: '6443'
kubeProxyReplacement: true
l7Proxy: true
ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
  hostNetwork:
    enabled: true
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - BPF
        - NET_BIND_SERVICE
