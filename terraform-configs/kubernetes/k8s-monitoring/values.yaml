collectors:
  alloy-singleton:
    presets: [singleton]
    alloy:
      extraArgs:
        - "--disable-reporting"

clusterEvents:
  enabled: true
  collector: alloy-singleton

cluster:
  name: "kubernetes"

destinations:
  localPrometheus:
    type: prometheus
    url: http://prometheus.laptop1.local/api/v1/write

  hostedLogs:
    type: loki
    url: http://loki.laptop1.local/loki/api/v1/push
    auth:
      # type: basic
      # username: "my-username"
      # password: "my-password"
      tenantId: "fake"
