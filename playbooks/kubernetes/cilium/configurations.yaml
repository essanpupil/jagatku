---
- name: Install Cilium CNI via Helm
  hosts: laptop1
  tasks:
    - name: Ensure helm-diff plugin is installed
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        verify: false
        state: present

    - name: Deploy Cilium Helm chart
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium
        chart_repo_url: "https://helm.cilium.io"
        chart_version: "1.19.6"
        release_namespace: "kube-system"
        create_namespace: false
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"
        values:
          k8sServiceHost: "{{ kubernetes.fqdn }}"
          k8sServicePort: "6443"
          kubeProxyReplacement: "true"
          policyEnforcementMode: "always"
          # routingMode: tunnel
          # tunnelProtocol: vxlan
          # healthPort: 9879
          ingressController:
            enabled: true
            default: true
            loadbalancerMode: shared
            hostNetwork:
              enabled: true
            service:
              type: NodePort
          bpf:
            masquerade: true
          hubble:
            enabled: false
            relay:
              enabled: false
            ui:
              enabled: false
              service:
                type: "NodePort"
          envoy:
            enabled: false
          nodeIPAM:
            enabled: true
        wait: true
        atomic: true
      register: cilium_install_result

    - name: Display Cilium installation summary
      ansible.builtin.debug:
        var: cilium_install_result
