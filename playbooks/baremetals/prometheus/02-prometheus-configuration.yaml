---
- name: Install and configure prometheus in laptop
  hosts: baremetals
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Install Prometheus
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-node-exporter
        state: present
    - name: Render prometheus config for validation
      check_mode: false
      ansible.builtin.template:
        src: config.prometheus.j2
        dest: /tmp/prometheus_config.yml
        owner: root
        mode: '0640'
    - name: Validate prometheus config
      check_mode: false
      ansible.builtin.command: promtool check config /tmp/prometheus_config.yml
      changed_when: false

    - name: Deploy Prometheus default arguments
      ansible.builtin.template:
        src: args.prometheus.j2
        dest: /etc/default/prometheus
        owner: root
        group: root
        mode: '0644'
      notify: Restart prometheus
    - name: Deploy Prometheus configurations
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/prometheus_config.yml
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: '0644'
        validate: promtool check config %s
      notify: Restart prometheus

    - name: Start Prometheus service
      ansible.builtin.systemd_service:
        name: prometheus
        state: started
        enabled: true

  handlers:
    - name: Restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
