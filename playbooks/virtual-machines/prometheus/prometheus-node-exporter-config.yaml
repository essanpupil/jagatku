---
- name: Install and configure prometheus in laptop
  hosts: kube_nodes
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Prometheus
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
        state: present
