---
- name: Install and configure various observability agents
  hosts: kube_nodes
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Install core packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - wget
          - gnupg
          - curl
          - unzip
          - bash
          - grep
          - nfs-common
          - systemd-resolved
        state: present
        update_cache: true

    - name: Enable systemd-resolved service
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: started
        enabled: true
        daemon_reload: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Grafana GPG key
      ansible.builtin.get_url:
        url: https://packages.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.key
        mode: "0644"
    - name: De-armor Grafana GPG key
      ansible.builtin.command: gpg --dearmor --yes -o /etc/apt/keyrings/grafana.gpg /etc/apt/keyrings/grafana.key
      args:
        creates: /etc/apt/keyrings/grafana.gpg
    - name: Add Grafana repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://packages.grafana.com/oss/deb stable main"
        state: present
        filename: grafana
    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: Download kubeadm gpg key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"
        force: true

    - name: De-armor Docker GPG key for APT
      ansible.builtin.command: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: De-armor kubeadm gpg key for APT
      ansible.builtin.command: gpg --dearmor --yes --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg /etc/apt/keyrings/kubernetes-apt-keyring.asc
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Add kubeadm repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
        state: present
        filename: kubernetes

    - name: Install Docker Engine
      ansible.builtin.apt:
        pkg:
          - docker-ce
          - containerd.io
        state: present
        update_cache: true

    - name: Start Docker service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Configure containerd for cri and systemdcgroup
      ansible.builtin.template:
        src: containerd.config.toml.j2
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: '0644'

    - name: Restart containerd service
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      register: swapoff_result
      changed_when: swapoff_result.rc == 0
      failed_when: swapoff_result.rc != 0 and "Invalid argument" not in swapoff_result.stderr

    - name: Disable swap permanently
      ansible.posix.mount:
        name: none
        fstype: swap
        state: absent

    - name: Install kubeadm package
      ansible.builtin.apt:
        pkg:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        update_cache: true

    - name: Hold kubeadm package to prevent updates
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Download and extract crictl binary
      ansible.builtin.unarchive:
        src: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Download and extract etcdctl binary
      ansible.builtin.unarchive:
        src: "https://github.com/coreos/etcd/releases/download/{{ etcdctl_version }}/etcd-{{ etcdctl_version }}-linux-amd64.tar.gz"
        dest: /tmp/
        remote_src: true
        owner: root
        group: root
      become: true

    - name: Copy etcdctl binary to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/etcd-{{ etcdctl_version }}-linux-amd64/etcdctl
        dest: /usr/local/bin/
        remote_src: true
        owner: root
        group: root
        mode: '07550'

    - name: Copy etcdutl binary to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/etcd-{{ etcdctl_version }}-linux-amd64/etcdutl
        dest: /usr/local/bin/
        remote_src: true
        owner: root
        group: root
        mode: '07550'

    - name: Download and extract crictl binary for arm64 processor
      when: ansible_architecture == 'aarch64'
      ansible.builtin.unarchive:
        src: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-arm64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Download and extract etcdctl binary for arm64 processor
      when: ansible_architecture == 'aarch64'
      ansible.builtin.unarchive:
        src: "https://github.com/coreos/etcd/releases/download/{{ etcdctl_version }}/etcd-{{ etcdctl_version }}-linux-arm64.tar.gz"
        dest: /tmp/
        remote_src: true
        owner: root
        group: root
      become: true

    - name: Copy etcdctl binary for arm64 processor to /usr/local/bin
      when: ansible_architecture == 'aarch64'
      ansible.builtin.copy:
        src: /tmp/etcd-{{ etcdctl_version }}-linux-arm64/etcdctl
        dest: /usr/local/bin/
        remote_src: true
        owner: root
        group: root
        mode: '07550'

    - name: Copy etcdutl binary for arm64 processor to /usr/local/bin
      when: ansible_architecture == 'aarch64'
      ansible.builtin.copy:
        src: /tmp/etcd-{{ etcdctl_version }}-linux-arm64/etcdutl
        dest: /usr/local/bin/
        remote_src: true
        owner: root
        group: root
        mode: '07550'
