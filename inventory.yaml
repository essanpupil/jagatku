---
all:
  vars:
    ansible_distribution: 'Ubuntu'
    kubernetes_cidr: "10.244.0.0/16"
    kube_version: "v1.36.0"
    calico_version: "3.32.0"
    helm_version: "3.21.2"
    helm_arch: "amd64"
    crictl_version: "v1.36.0"
    etcdctl_version: "v3.7.1"
    grafana_local_domain: "grafana.laptop1.local"
  children:
    baremetals:
      hosts:
        laptop1:
          ansible_user: essan
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ansible_python_interpreter: /usr/bin/python3
          ansible_host: 192.168.1.50
    kube_nodes:
      children:
        servers:
          hosts:
            node1:
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
              ansible_python_interpreter: /usr/bin/python3
              ansible_host: 192.168.1.12
              node_name: node1
            cp1:
              ansible_user: vboxuser
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
              ansible_python_interpreter: /usr/bin/python3
              ansible_host: 192.168.1.10
              node_name: cp1
            cp2:
              ansible_user: vboxuser
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
              ansible_python_interpreter: /usr/bin/python3
              ansible_host: 192.168.1.11
              node_name: cp1
        workers:
          hosts:
            node2:
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
              ansible_python_interpreter: /usr/bin/python3
              ansible_host: 192.168.1.13
              node_name: node2
            node3:
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
              ansible_python_interpreter: /usr/bin/python3
              ansible_host: 192.168.1.14
              node_name: node3
            node4:
              ansible_user: vagrant
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
              ansible_python_interpreter: /usr/bin/python3
              ansible_host: 192.168.1.15
              node_name: node4
